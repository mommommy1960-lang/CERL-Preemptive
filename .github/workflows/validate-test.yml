# Sample validate-test.yml
# Workflow to validate test cases

name: Validate Test Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dcae3907b8f5a4f4d7b3a1e4c77 # v4
        with:
          node-version: '14'

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            echo "package.json found in repo root — installing dependencies"
            npm ci
          else
            echo "No package.json in repo root; skipping npm install"
          fi

      - name: Run tests (if package.json exists)
        run: |
          if [ -f package.json ]; then
            echo "Running npm test"
            npm test
          else
            echo "No package.json in repo root; skipping tests"
          fi

      - name: Report results
        if: always()
        run: |
          echo "Results are reported here"
